[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sbic-tracker"
version = "0.2.0"
description = "UNMAINTAINED. SBIC investment portfolio analyzer — fund-level IRR/TVPI/DPI and licensee modeling. Live SBA data loading is NOT implemented; the package returns sample data only when explicitly requested. See README."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jay Patel", email = "thejaypatel1511@gmail.com" }]
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Homepage = "https://github.com/Jaypatel1511/sbic-tracker"
Repository = "https://github.com/Jaypatel1511/sbic-tracker"

[tool.pytest.ini_options]
# --import-mode=importlib is required, not cosmetic. Under the default "prepend"
# mode pytest puts the rootdir on sys.path, so `import sbictracker` resolves to
# ./sbictracker even when a built wheel is the thing under test — CI would report
# green for the wheel while actually exercising the source tree. The release
# workflow also passes this flag explicitly, because the wheel-test job runs the
# suite from a copied directory that does not contain this file.
addopts = "--import-mode=importlib"
testpaths = ["tests"]
